name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法。请先读一遍下面三条硬约束——如果提案与它们冲突，大概率不会被接受。

        > 1. **宿主入口不能改回 `index.js`。** 改名是让 ESM 路径缓存失效、免重启激活宿主改动的唯一手段。
        > 2. **不能引入构建步骤。** 浏览器半边必须是手写的、装上即用的模块。
        > 3. **不能削弱安全约束。** 尤其是 `open` 的 loopback 校验、设置接口的键白名单，
        >    以及清理范围不得扩大到 Cookie 与 Local Storage。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue 与 README 的「已知限制」，确认这是新建议
          required: true
        - label: 我已经读过上方的三条硬约束，我的提案不与之冲突
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的是什么问题？
      description: 不要直接跳到方案——先说清楚你被什么卡住了
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么做？
      description: 如果能说明它在界面上应该长什么样、怎么交互，会帮助很大
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: 这个改动大概落在哪一边？
      description: 本插件横跨三种运行环境，先说清楚能省很多事
      options:
        - 宿主半边（`plugin/host.js`）
        - 浏览器半边（`plugin/client.js`）
        - 窗口页面（`plugin/page/float.html`）
        - 原生窗口（`window/src/FloatWindow.cs`）
        - 文档 / 模板 / 打包
        - 说不准（在描述里说明）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 例如用 DSH 自带功能、用别的插件、或者干脆不改
    validations:
      required: false

  - type: textarea
    id: risk
    attributes:
      label: 风险与影响
      description: |
        这个改动会不会新增或扩大文件删除范围？会不会新增网络请求？
        会不会让窗口继承更多环境变量、或让宿主的注入服务被属性访问？
    validations:
      required: true
